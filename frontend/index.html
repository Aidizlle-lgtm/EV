<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050a14">
  <title>E.V. Command Center</title>
  <link rel="icon" href="/static/assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/static/css/fonts.css">
  <link rel="stylesheet" href="/static/css/ev.css">
  <link rel="stylesheet" href="/static/css/friday.css">
</head>
<body>
  <!-- Boot splash (your E.V. logo) -->
  <div class="boot" id="boot"><div class="boot-line">INITIALIZING E.V.</div></div>

  <!-- Sign in / first-run setup -->
  <div class="login hidden" id="login">
    <div class="login-card panel">
      <img src="/static/assets/ev-logo.webp" alt="E.V. logo">
      <h1>E.V. COMMAND CENTER</h1>
      <p id="login-msg">Enter your passcode.</p>
      <form id="login-form" autocomplete="on">
        <label class="setup-only hidden">Your name (optional)
          <input type="text" id="login-name" maxlength="60" autocomplete="nickname">
        </label>
        <label>Passcode
          <input type="password" id="login-pass" required minlength="6" autocomplete="current-password">
        </label>
        <label class="setup-only hidden">Confirm passcode
          <input type="password" id="login-pass2" minlength="6" autocomplete="new-password">
        </label>
        <button class="btn primary" type="submit" id="login-btn">Unlock</button>
        <div class="small muted" id="login-err" role="alert"></div>
      </form>
    </div>
  </div>

  <div class="app hidden" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Navigation">
      <div class="brand">
        <div class="brand-ring" aria-hidden="true"></div>
        <div><div class="brand-name">E.V</div><div class="brand-sub">COMMAND CENTER</div></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <section class="panel voice-card" aria-label="Voice">
        <div class="panel-head"><h2 class="panel-title">Voice Status</h2><button class="link" data-go="settings" aria-label="Voice settings">›</button></div>
        <canvas class="voice-wave" id="voice-wave" width="220" height="46" aria-hidden="true"></canvas>
        <div class="voice-state" id="voice-state">Ready</div>
        <button class="mic-btn" id="mic-main" aria-label="Tap to speak"></button>
        <div class="voice-state">Tap to Speak</div>
      </section>
      <button class="btn ghost focus-btn" id="focus-btn"></button>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menu"></button>
        <div class="status-pill" id="status-pill">SYSTEM STATUS <span class="dot"></span><span class="val" id="status-val">—</span></div>
        <div class="clock" aria-live="off"><div class="date" id="clock-date"></div><div class="time" id="clock-time"></div></div>
        <div class="search">
          <span id="search-ico"></span>
          <input type="search" id="search" placeholder="Search…" aria-label="Search tasks, memories, documents, conversations">
          <div class="search-results panel plain hidden" id="search-results"></div>
        </div>
        <button class="icon-btn hide-sm" id="fullscreen-btn" aria-label="Full screen"></button>
        <button class="icon-btn" id="bell-btn" aria-label="Notifications"><span class="badge" id="bell-badge"></span></button>
        <button class="icon-btn" id="gear-btn" aria-label="Settings"></button>
        <div class="operator" id="operator" title="Account">
          <div class="who"><b id="op-name">Operator</b><span id="op-title">Commander</span></div>
          <div class="avatar" id="op-avatar"></div>
        </div>
      </header>
      <main class="view" id="view" tabindex="-1"></main>
    </div>

    <footer class="dock">
      <div class="dock-card"><span id="d-loc-ico"></span><div><span class="k">Location</span><b id="d-loc">Setup required</b></div></div>
      <div class="dock-card"><span id="d-wx-ico"></span><div><span class="k">Weather</span><b id="d-wx">—</b></div></div>
      <div class="dock-card"><span id="d-net-ico"></span><div><span class="k">Network</span><b id="d-net">—</b></div></div>
      <button class="talk" id="talk-btn" aria-label="Talk to E.V.">
        <div class="bars" aria-hidden="true"></div>
        <div><b>TALK TO E.V</b><span id="talk-sub">Open chat</span></div>
        <div class="bars r" aria-hidden="true"></div>
      </button>
      <button class="btn blue brief-btn" id="brief-btn" aria-label="Executive Briefing"><span id="brief-ico"></span><span class="lbl">Executive Briefing</span></button>
    </footer>

    <!-- Chat drawer -->
    <div class="scrim hidden" id="chat-scrim"></div>
    <section class="chat" id="chat" aria-label="Conversation with E.V.">
      <div class="chat-head">
        <button class="icon-btn" id="chat-history-btn" aria-label="Conversation history"></button>
        <div class="title"><b id="chat-title">New conversation</b><span id="chat-sub">—</span></div>
        <select id="chat-agent" aria-label="Agent mode"></select>
        <button class="icon-btn" id="chat-new" aria-label="New conversation"></button>
        <button class="icon-btn" id="chat-close" aria-label="Close chat"></button>
      </div>
      <div class="chat-history hidden" id="chat-history"></div>
      <div class="chat-log" id="chat-log" aria-live="polite"></div>
      <form class="composer" id="composer">
        <button type="button" class="icon-btn mic" id="chat-mic" aria-label="Speak"></button>
        <textarea id="chat-input" rows="1" placeholder="Message E.V.…" aria-label="Message"></textarea>
        <button type="submit" class="icon-btn send" id="chat-send" aria-label="Send"></button>
      </form>
    </section>
  </div>

  <!-- F.R.I.D.A.Y.'s workspace (route #/friday) — filled by js/friday.js -->
  <div class="friday hidden" id="friday-root" aria-label="F.R.I.D.A.Y. workspace"></div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
